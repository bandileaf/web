<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="영단어를 접두사, 어근, 접미사로 나누어 네트워크로 보여주는 단어 구조 지도">
  <title>Word Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6fb;
      --surface: #ffffff;
      --surface-2: #eef0f8;
      --border: rgba(20, 24, 40, 0.10);
      --text: #161a2b;
      --muted: #5d6479;
      --edge: rgba(93, 100, 121, 0.28);
      --pre: #5b6cff;
      --root: #12a37f;
      --suf: #e8890c;
      --shadow: 0 8px 30px rgba(40, 50, 100, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1020;
        --surface: #171b33;
        --surface-2: #202546;
        --border: rgba(255, 255, 255, 0.10);
        --text: #eceffa;
        --muted: #9aa2bd;
        --edge: rgba(154, 162, 189, 0.30);
        --pre: #8a95ff;
        --root: #3ddbb0;
        --suf: #ffb454;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Inter", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(40vw 40vw at 8% -5%, color-mix(in srgb, var(--pre) 22%, transparent), transparent 70%),
        radial-gradient(36vw 36vw at 100% 10%, color-mix(in srgb, var(--root) 18%, transparent), transparent 70%),
        radial-gradient(34vw 34vw at 60% 110%, color-mix(in srgb, var(--suf) 16%, transparent), transparent 70%);
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }

    header { padding: 44px 0 22px; text-align: center; }
    .brand { font-weight: 700; letter-spacing: -0.02em; color: var(--muted); font-size: 0.92rem; }
    h1 {
      margin: 10px 0 12px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: -0.04em; line-height: 1.12; font-weight: 700;
    }
    h1 .p { color: var(--pre); }
    h1 .r { color: var(--root); }
    h1 .s { color: var(--suf); }
    header p { color: var(--muted); font-weight: 300; max-width: 560px; margin: 0 auto; }

    .legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .tag {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 13px; border-radius: 999px; font-size: 0.84rem;
      background: var(--surface); border: 1px solid var(--border);
    }
    .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
    .t-p { --c: var(--pre); } .t-r { --c: var(--root); } .t-s { --c: var(--suf); }

    /* 단어 선택 바 */
    .words { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 26px 0 18px; }
    .chip {
      font: inherit; font-size: 0.92rem; font-weight: 500; cursor: pointer;
      padding: 7px 15px; border-radius: 999px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      transition: transform .15s, background .15s, border-color .15s, color .15s;
    }
    .chip:hover { transform: translateY(-2px); border-color: var(--root); }
    .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .chip.faded { opacity: .55; }

    /* 카드 */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; box-shadow: var(--shadow);
    }

    /* 상세 패널 */
    .detail { padding: 26px 24px; margin-bottom: 18px; text-align: center; }
    .eq { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; }
    .eq .plus { color: var(--muted); font-weight: 300; }
    .part {
      padding: 4px 16px 6px; border-radius: 14px;
      color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
      border: 1.5px solid color-mix(in srgb, var(--c) 45%, transparent);
    }
    .part.p { --c: var(--pre); } .part.r { --c: var(--root); } .part.s { --c: var(--suf); }
    .result { margin-top: 12px; font-size: 1.05rem; }
    .result b { font-weight: 700; }
    .result span { color: var(--muted); }
    .meanings { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .meaning { font-size: 0.86rem; padding: 4px 12px; border-radius: 10px; background: var(--surface-2); }
    .meaning b { color: var(--c); margin-right: 6px; }
    .related { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .hint { color: var(--muted); font-size: 0.84rem; margin-top: 14px; }

    /* 네트워크 */
    .net { padding: 14px 8px 8px; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 680px; height: auto; }
    .colhead { font-size: 14px; font-weight: 600; fill: var(--muted); text-anchor: middle; letter-spacing: .02em; }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: stroke .2s, stroke-width .2s, opacity .2s; }
    .edge.on { stroke: var(--text); stroke-width: 3; opacity: 1; }
    .edge.dim { opacity: .10; }
    .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
    .node { cursor: pointer; outline: none; transition: opacity .2s; }
    .node rect {
      fill: color-mix(in srgb, var(--c) 13%, var(--surface));
      stroke: color-mix(in srgb, var(--c) 55%, transparent); stroke-width: 1.5;
      transition: fill .2s, stroke-width .2s;
    }
    .node.p { --c: var(--pre); } .node.r { --c: var(--root); } .node.s { --c: var(--suf); }
    .node .lab { font-size: 17px; font-weight: 700; fill: var(--c); text-anchor: start; }
    .node .ko { font-size: 12.5px; fill: var(--muted); text-anchor: end; }
    .node:hover rect, .node:focus-visible rect { stroke-width: 2.6; }
    .node.on rect { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); stroke: var(--c); stroke-width: 2.6; }
    .node.dim { opacity: .28; }

    footer { text-align: center; color: var(--muted); font-size: 0.84rem; padding: 34px 0 0; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">WORD ATLAS</div>
      <h1><span class="p">pre</span> + <span class="r">mate</span> + <span class="s">able</span><br>단어를 쪼개면 보입니다</h1>
      <p>중·고등 필수 단어 20개를 접두사, 어근, 접미사로 나누고 하나의 지도로 연결했어요. 단어나 조각을 눌러 보세요.</p>
      <div class="legend">
        <span class="tag t-p"><i></i>접두사 Prefix</span>
        <span class="tag t-r"><i></i>어근 Root</span>
        <span class="tag t-s"><i></i>접미사 Suffix</span>
      </div>
    </header>

    <div class="words" id="words" role="group" aria-label="단어 선택"></div>

    <section class="card detail" id="detail" aria-live="polite"></section>

    <section class="card net">
      <div class="scroll">
        <svg id="svg" viewBox="0 0 900 640" role="img" aria-label="접두사, 어근, 접미사 연결 네트워크"></svg>
      </div>
    </section>

    <footer>bandileaf · GitHub Pages</footer>
  </div>

  <script>
    // ── 데이터 ─────────────────────────────────────────────
    const PRE = [
      ['un', '부정'], ['re', '다시'], ['pre', '이전'], ['im', '안으로'], ['ex', '밖으로'],
      ['trans', '가로질러'], ['dis', '반대'], ['inter', '사이'], ['con', '함께'], ['de', '아래로 · 반대']
    ];
    const ROOT = [
      ['happy', '행복한'], ['break', '깨다'], ['use', '사용하다'], ['view', '보다'], ['dict', '말하다'],
      ['port', '나르다'], ['agree', '동의하다'], ['act', '행하다'], ['form', '모양'], ['struct', '짓다']
    ];
    const SUF = [
      ['able', '~할 수 있는'], ['ful', '~로 가득한'], ['less', '~이 없는'], ['ion', '행위 · 명사'],
      ['ment', '결과 · 명사'], ['ive', '~하는 성향'], ['or', '~하는 사람']
    ];
    const WORDS = [
      { w: 'unhappy',       p: 'un',    r: 'happy',  s: null,   ko: '불행한' },
      { w: 'unbreakable',   p: 'un',    r: 'break',  s: 'able', ko: '깨지지 않는' },
      { w: 'reusable',      p: 're',    r: 'use',    s: 'able', ko: '재사용할 수 있는' },
      { w: 'review',        p: 're',    r: 'view',   s: null,   ko: '복습하다, 검토' },
      { w: 'preview',       p: 'pre',   r: 'view',   s: null,   ko: '미리 보기' },
      { w: 'prediction',    p: 'pre',   r: 'dict',   s: 'ion',  ko: '예측' },
      { w: 'import',        p: 'im',    r: 'port',   s: null,   ko: '수입하다' },
      { w: 'export',        p: 'ex',    r: 'port',   s: null,   ko: '수출하다' },
      { w: 'transport',     p: 'trans', r: 'port',   s: null,   ko: '수송하다' },
      { w: 'portable',      p: null,    r: 'port',   s: 'able', ko: '휴대할 수 있는' },
      { w: 'disagreement',  p: 'dis',   r: 'agree',  s: 'ment', ko: '의견 차이' },
      { w: 'useful',        p: null,    r: 'use',    s: 'ful',  ko: '유용한' },
      { w: 'useless',       p: null,    r: 'use',    s: 'less', ko: '쓸모없는' },
      { w: 'action',        p: null,    r: 'act',    s: 'ion',  ko: '행동' },
      { w: 'active',        p: null,    r: 'act',    s: 'ive',  ko: '활동적인' },
      { w: 'actor',         p: null,    r: 'act',    s: 'or',   ko: '배우' },
      { w: 'interact',      p: 'inter', r: 'act',    s: null,   ko: '상호작용하다' },
      { w: 'transform',     p: 'trans', r: 'form',   s: null,   ko: '변형시키다' },
      { w: 'construction',  p: 'con',   r: 'struct', s: 'ion',  ko: '건설' },
      { w: 'destruction',   p: 'de',    r: 'struct', s: 'ion',  ko: '파괴' }
    ];

    // ── 레이아웃 ───────────────────────────────────────────
    const NS = 'http://www.w3.org/2000/svg';
    const COLX = { p: 150, r: 450, s: 750 };
    const NW = 170, NH = 40, TOP = 90, GAP = 54;
    const KIND = { p: PRE, r: ROOT, s: SUF };
    const SIGN = { p: (t) => t + '-', r: (t) => t, s: (t) => '-' + t };
    const HEAD = { p: '접두사  Prefix', r: '어근  Root', s: '접미사  Suffix' };
    const pos = {};
    const nodeEls = {};
    const edgeEls = [];
    const svg = document.getElementById('svg');

    const el = (name, attrs = {}, parent) => {
      const e = document.createElementNS(NS, name);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    };

    const edgesLayer = el('g', {}, svg);
    const nodesLayer = el('g', {}, svg);

    for (const kind of ['p', 'r', 's']) {
      const h = el('text', { class: 'colhead', x: COLX[kind], y: 42 }, svg);
      h.textContent = HEAD[kind];
      KIND[kind].forEach(([t, ko], i) => {
        const id = kind + ':' + t;
        const x = COLX[kind], y = TOP + i * GAP;
        pos[id] = { x, y };
        const g = el('g', { class: 'node ' + kind, tabindex: 0, role: 'button', 'aria-label': SIGN[kind](t) + ' ' + ko }, nodesLayer);
        el('rect', { x: x - NW / 2, y: y - NH / 2, width: NW, height: NH, rx: 20 }, g);
        el('text', { class: 'lab', x: x - NW / 2 + 16, y: y + 6 }, g).textContent = SIGN[kind](t);
        el('text', { class: 'ko', x: x + NW / 2 - 14, y: y + 4.5 }, g).textContent = ko;
        g.addEventListener('click', () => choose({ part: id }));
        g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose({ part: id }); } });
        nodeEls[id] = g;
      });
    }

    const curve = (a, b) => {
      const x1 = a.x + NW / 2, x2 = b.x - NW / 2, mx = (x1 + x2) / 2;
      return `M${x1},${a.y} C${mx},${a.y} ${mx},${b.y} ${x2},${b.y}`;
    };

    WORDS.forEach((wd) => {
      wd.ids = [wd.p && 'p:' + wd.p, 'r:' + wd.r, wd.s && 's:' + wd.s].filter(Boolean);
      wd.paths = [];
      for (let i = 0; i < wd.ids.length - 1; i++) {
        const d = curve(pos[wd.ids[i]], pos[wd.ids[i + 1]]);
        const path = el('path', { class: 'edge', d }, edgesLayer);
        const hit = el('path', { class: 'hit', d }, edgesLayer);
        hit.addEventListener('click', () => choose({ word: wd.w }));
        hit.addEventListener('mouseenter', () => path.classList.add('on'));
        hit.addEventListener('mouseleave', () => render());
        wd.paths.push(path);
      }
    });

    // ── 단어 버튼 ──────────────────────────────────────────
    const wordsBar = document.getElementById('words');
    const chipEls = {};
    WORDS.forEach((wd) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = wd.w;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => choose({ word: wd.w }));
      wordsBar.appendChild(b);
      chipEls[wd.w] = b;
    });

    // ── 상태와 렌더링 ──────────────────────────────────────
    let sel = { word: 'unbreakable' };
    const same = (a, b) => (a.word && a.word === b.word) || (a.part && a.part === b.part);
    function choose(next) { sel = same(sel, next) ? {} : next; render(); }

    const partInfo = (id) => {
      const [k, t] = id.split(':');
      return { k, t, ko: KIND[k].find((x) => x[0] === t)[1] };
    };

    function render() {
      let activeWords;
      if (sel.word) activeWords = WORDS.filter((w) => w.w === sel.word);
      else if (sel.part) activeWords = WORDS.filter((w) => w.ids.includes(sel.part));
      else activeWords = [];
      const filtering = activeWords.length > 0;
      const activeIds = new Set(activeWords.flatMap((w) => w.ids));

      WORDS.forEach((wd) => {
        const on = activeWords.includes(wd);
        wd.paths.forEach((p) => {
          p.classList.toggle('on', on);
          p.classList.toggle('dim', filtering && !on);
        });
        chipEls[wd.w].setAttribute('aria-pressed', String(sel.word === wd.w));
        chipEls[wd.w].classList.toggle('faded', filtering && !on);
      });
      Object.entries(nodeEls).forEach(([id, g]) => {
        g.classList.toggle('on', filtering && activeIds.has(id));
        g.classList.toggle('dim', filtering && !activeIds.has(id));
      });
      // 선택된 요소를 위로
      activeWords.forEach((w) => w.paths.forEach((p) => edgesLayer.appendChild(p)));
      renderDetail(activeWords);
    }

    const chipHTML = (id) => {
      const { k, t } = partInfo(id);
      return `<span class="part ${k}">${t}</span>`;
    };

    function renderDetail(activeWords) {
      const box = document.getElementById('detail');
      if (sel.word) {
        const wd = activeWords[0];
        box.innerHTML =
          `<div class="eq">${wd.ids.map(chipHTML).join('<span class="plus">+</span>')}</div>` +
          `<div class="result"><span>=</span> <b>${wd.w}</b> <span>· ${wd.ko}</span></div>` +
          `<div class="meanings">${wd.ids.map((id) => {
            const { k, t, ko } = partInfo(id);
            return `<span class="meaning ${k}" style="--c:var(--${k === 'p' ? 'pre' : k === 'r' ? 'root' : 'suf'})"><b>${SIGN[k](t)}</b>${ko}</span>`;
          }).join('')}</div>`;
      } else if (sel.part) {
        const { k, t, ko } = partInfo(sel.part);
        box.innerHTML =
          `<div class="eq">${chipHTML(sel.part)}</div>` +
          `<div class="result"><b>${SIGN[k](t)}</b> <span>· ${ko}</span></div>` +
          `<div class="related">${activeWords.map((w) => `<button class="chip" type="button" data-w="${w.w}">${w.w}</button>`).join('')}</div>` +
          `<div class="hint">이 조각이 들어간 단어 ${activeWords.length}개</div>`;
        box.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => choose({ word: b.dataset.w })));
      } else {
        box.innerHTML = `<div class="result"><b>단어나 조각을 선택하세요</b></div><div class="hint">같은 조각을 다시 누르면 선택이 해제됩니다</div>`;
      }
    }

    render();
  </script>
</body>
</html>
